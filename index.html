<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>喝水记录</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f7;
      color: #111;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    h1 {
      font-size: 28px;
      margin: 8px 0 24px;
      text-align: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 7px;
    }
    input, select {
      width: 100%;
      font-size: 18px;
      padding: 12px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      background: white;
      margin-bottom: 16px;
    }
    .custom-row {
      display: grid;
      grid-template-columns: 1fr 100px;
      gap: 10px;
      align-items: start;
    }
    .custom-row input,
    .custom-row select {
      margin-bottom: 16px;
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 12px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
    }
    #addBtn { background: #111; color: white; }
    #viewBtn { background: #e5e5ea; color: #111; }
    #message {
      min-height: 24px;
      text-align: center;
      margin-top: 14px;
      font-size: 15px;
      color: #2e7d32;
    }
    #records { display: none; }
    .day {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    .day-date { font-size: 18px; font-weight: 700; }
    .day-total { font-size: 16px; font-weight: 700; }
    .entry {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      font-size: 16px;
    }
    .empty {
      text-align: center;
      color: #777;
      padding: 28px 0;
    }
    .small {
      font-size: 13px;
      color: #777;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>喝水记录</h1>

    <div class="card">
      <label for="dateTime">日期时间</label>
      <input id="dateTime" type="datetime-local" />

      <label for="amount">摄入容量</label>
      <select id="amount">
        <option value="180">180 mL / 6 oz · 一合 / 半杯</option>
        <option value="355" selected>355 mL / 12 oz · 一罐</option>
        <option value="500">500 mL / 16.9 oz · 一瓶 / 半壶</option>
        <option value="custom">自己输入…</option>
      </select>

      <div id="customAmountBox" style="display:none;">
        <label for="customAmount">具体容量</label>
        <div class="custom-row">
          <input id="customAmount" type="number" inputmode="decimal" min="0" step="0.1" placeholder="输入容量" />
          <select id="customUnit">
            <option value="ml" selected>mL</option>
            <option value="oz">oz</option>
          </select>
        </div>
      </div>

      <div class="buttons">
        <button id="addBtn">输入</button>
        <button id="viewBtn">查看</button>
      </div>

      <div id="message"></div>
      <div class="small">记录只保存在当前设备的浏览器中</div>
    </div>

    <div id="records"></div>
  </div>

  <script>
    const STORAGE_KEY = "waterTrackerEntriesV1";
    const dateTimeInput = document.getElementById("dateTime");
    const amountSelect = document.getElementById("amount");
    const customAmountBox = document.getElementById("customAmountBox");
    const customAmountInput = document.getElementById("customAmount");
    const customUnitSelect = document.getElementById("customUnit");
    const addBtn = document.getElementById("addBtn");
    const viewBtn = document.getElementById("viewBtn");
    const message = document.getElementById("message");
    const recordsDiv = document.getElementById("records");

    function toLocalInputValue(date = new Date()) {
      const pad = n => String(n).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function setNow() {
      dateTimeInput.value = toLocalInputValue(new Date());
    }

    function loadEntries() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveEntries(entries) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
    }

    function formatDate(date) {
      return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(date);
    }

    function formatTime(date) {
      return new Intl.DateTimeFormat("zh-CN", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(date);
    }

    function mlToOz(ml) {
      return ml / 29.5735;
    }

    function addEntry() {
      const timeValue = dateTimeInput.value || toLocalInputValue(new Date());

      let amount;
      let displayAmount;

      if (amountSelect.value === "custom") {
        const entered = Number(customAmountInput.value);
        if (!entered || entered <= 0) {
          message.style.color = "#b00020";
          message.textContent = "请输入有效容量";
          return;
        }

        if (customUnitSelect.value === "oz") {
          amount = entered * 29.5735;
          displayAmount = `${entered} oz`;
        } else {
          amount = entered;
          displayAmount = `${entered} mL`;
        }
      } else {
        amount = Number(amountSelect.value || 355);
        displayAmount = `${amount} mL`;
      }

      // 内部统一保存为 mL，允许自定义输入产生小数
      amount = Math.round(amount * 10) / 10;

      const entries = loadEntries();
      entries.push({
        id: Date.now() + Math.random(),
        time: new Date(timeValue).toISOString(),
        amount
      });

      entries.sort((a, b) => new Date(b.time) - new Date(a.time));
      saveEntries(entries);

      message.style.color = "#2e7d32";
      message.textContent = `已记录 ${displayAmount}`;
      recordsDiv.style.display = "none";

      // 输入后自动恢复默认值，方便下一次直接打开就点输入
      setNow();
      amountSelect.value = "355";
      customAmountBox.style.display = "none";
      customAmountInput.value = "";
      customUnitSelect.value = "ml";

      setTimeout(() => {
        message.textContent = "";
      }, 1800);
    }

    function renderEntries() {
      const entries = loadEntries();
      recordsDiv.innerHTML = "";
      recordsDiv.style.display = "block";

      if (!entries.length) {
        recordsDiv.innerHTML = '<div class="empty">还没有记录</div>';
        return;
      }

      const groups = {};

      for (const entry of entries) {
        const d = new Date(entry.time);
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
        if (!groups[key]) groups[key] = [];
        groups[key].push(entry);
      }

      const sortedDays = Object.keys(groups).sort().reverse();

      for (const key of sortedDays) {
        const dayEntries = groups[key].sort((a,b) => new Date(b.time)-new Date(a.time));
        const total = dayEntries.reduce((sum, e) => sum + e.amount, 0);
        const firstDate = new Date(dayEntries[0].time);

        const day = document.createElement("div");
        day.className = "day";

        const header = document.createElement("div");
        header.className = "day-header";

        const dateEl = document.createElement("div");
        dateEl.className = "day-date";
        dateEl.textContent = formatDate(firstDate);

        const totalEl = document.createElement("div");
        totalEl.className = "day-total";
        totalEl.textContent = `${total} mL / ${mlToOz(total).toFixed(1)} oz`;

        header.appendChild(dateEl);
        header.appendChild(totalEl);
        day.appendChild(header);

        for (const entry of dayEntries) {
          const d = new Date(entry.time);
          const row = document.createElement("div");
          row.className = "entry";

          const timeEl = document.createElement("span");
          timeEl.textContent = formatTime(d);

          const amountEl = document.createElement("span");
          const ml = Number(entry.amount);
          amountEl.textContent = `${Number.isInteger(ml) ? ml : ml.toFixed(1)} mL`;

          row.appendChild(timeEl);
          row.appendChild(amountEl);
          day.appendChild(row);
        }

        recordsDiv.appendChild(day);
      }
    }

    amountSelect.addEventListener("change", () => {
      const isCustom = amountSelect.value === "custom";
      customAmountBox.style.display = isCustom ? "block" : "none";
      if (isCustom) {
        setTimeout(() => customAmountInput.focus(), 0);
      }
    });

    addBtn.addEventListener("click", addEntry);
    viewBtn.addEventListener("click", renderEntries);

    setNow();
  </script>
</body>
</html>
